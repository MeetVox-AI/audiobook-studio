[project]
name = "audiobook-engine"
version = "0.1.0"
description = "Local EPUB/PDF to M4B audiobook engine (MLX)"
authors = [
    { name = "antoine-debroye", email = "144667691+antoine-debroye@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "en-core-web-sm",
    "lxml>=6.1.3",
    "misaki[en]>=0.9.4",
    "mistral-common[audio]>=1.12",
    "mlx-audio[tts]>=0.5.8",
    "num2words>=0.5.14",
    "numpy>=1.26",
    "pymupdf>=1.28.2",
    "soundfile>=0.14.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
audiobook-engine = "audiobook_engine.cli:main"
