name: Feature request
description: Suggest an improvement to the app, the engine or the docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you are in, rather than only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: For example, doing it today with another tool, or a smaller change that would also help.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps everything on the Mac (no uploads)
          required: true
